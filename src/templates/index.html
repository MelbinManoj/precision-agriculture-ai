<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Monitoring Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #6dd5fa, #2980b9);
            color: #fff;
        }
        header {
            background: #1abc9c;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        nav {
            display: flex;
            justify-content: center;
            padding: 10px;
            background: #16a085;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            font-weight: 500;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #c0392b;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
        }
        .result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: 600;
        }
        .healthy { color: #2ecc71; }
        .diseased { color: #e74c3c; }
        button {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 10px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>Welcome to the Crop Monitoring Dashboard</header>
    <nav>
        <a href="/">Home</a>
    </nav>
    <div class="container">
        <p>Monitor your crops in real time and ensure their health and productivity.</p>
        <form action="/predict" method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" required>
            <button type="submit">Start Monitoring</button>
        </form>
        {% if result %}
        <div class="result {{ 'healthy' if result == 'Healthy' else 'diseased' }}">{{ result }}</div>
        {% endif %}
    </div>
</body>
</html>
